version: '3.8'

services:
  neuralflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neuralflow-app
    ports:
      - "3001:3001"   # Main API
      - "4000:4000"   # Internal router
      - "5100:5100"   # External router
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - API_KEY=${API_KEY:-}
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3001
    volumes:
      - neuralflow-logs:/app/backend/logs
      - neuralflow-models:/app/backend/models
    restart: unless-stopped
    networks:
      - neuralflow-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: neuralflow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - neuralflow
    restart: unless-stopped
    networks:
      - neuralflow-network

volumes:
  neuralflow-logs:
    driver: local
  neuralflow-models:
    driver: local

networks:
  neuralflow-network:
    driver: bridge
