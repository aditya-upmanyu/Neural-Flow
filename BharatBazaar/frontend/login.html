<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BHARATBAZAR</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e8ecff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: rgba(30, 35, 64, 0.85);
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(122, 60, 240, 0.08), 0 2px 4px rgba(25, 211, 218, 0.18);
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 380px;
            margin: 2rem;
        }
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            margin-bottom: 2.5rem;
        }
        .brand-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #19D3DA, #7A3CF0);
            animation: pulse 2s infinite;
        }
        .brand-name {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            background: linear-gradient(135deg, #7A3CF0 0%, #19D3DA 85%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.75; }
        }
        .login-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 2rem;
            color: #fff;
        }
        .login-form label {
            color: #c9ceef;
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            display: block;
        }
        .input-group {
            margin-bottom: 1.5rem;
        }
        .login-form input {
            width: 100%;
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid #32367a;
            background: #20263a;
            color: #e8ecff;
            font-size: 1rem;
            outline: none;
            margin-bottom: 0.15rem;
        }
        .login-form input:focus {
            border-color: #19d3da;
            background: #282d4b;
        }
        .login-form button {
            width: 100%;
            background: linear-gradient(135deg, #7A3CF0 0%, #FF66C4 100%);
            color: #fff;
            border: none;
            font-weight: 700;
            padding: 1rem;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.6rem;
        }
        .login-form button:hover {
            box-shadow: 0 4px 18px #7A3CF0BB;
            transform: translateY(-2px) scale(1.01);
            background: linear-gradient(135deg, #FF66C4 0%, #7A3CF0 100%);
        }
        .login-links {
            text-align: center;
            margin-top: 1.8rem;
        }
        .login-links a {
            color: #19d3da;
            text-decoration: underline;
            cursor: pointer;
            margin: 0 0.5rem;
        }
        .login-links a:hover {
            color: #ff66c4;
        }
        .error-message, .success-message {
            margin: 0.7rem 0;
            font-size: 0.94rem;
            text-align: center;
            padding: 0.8rem;
            border-radius: 8px;
        }
        .error-message { 
            color: #ff4d6d; 
            background: rgba(255, 77, 109, 0.1);
            border: 1px solid rgba(255, 77, 109, 0.3);
        }
        .success-message { 
            color: #32e685; 
            background: rgba(50, 230, 133, 0.1);
            border: 1px solid rgba(50, 230, 133, 0.3);
        }
        .demo-credentials {
            background: rgba(122, 60, 240, 0.1);
            border: 1px solid rgba(122, 60, 240, 0.3);
            border-radius: 10px;
            padding: 1rem;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #c9ceef;
        }
        .demo-credentials h4 {
            margin: 0 0 0.5rem 0;
            color: #19d3da;
            font-size: 0.95rem;
        }
        .demo-credentials div {
            margin: 0.3rem 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="brand">
            <div class="brand-dot"></div>
            <span class="brand-name">BHARATBAZAR</span>
        </div>
        <div class="login-title">Sign In</div>
        <form class="login-form" onsubmit="event.preventDefault(); handleLogin();">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" required id="email" autocomplete="username" placeholder="you@example.com">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" required id="password" autocomplete="current-password" placeholder="Password">
            </div>
            <div class="error-message" id="errorMessage" style="display:none;"></div>
            <div class="success-message" id="successMessage" style="display:none;"></div>
            <button type="submit" id="loginBtn">Login</button>
        </form>
        <div class="login-links">
            New user?
            <a href="signup.html">Create an account</a>
            <br>
            <a href="#">Forgot password?</a>
        </div>
        <div class="demo-credentials">
            <h4>Demo Credentials:</h4>
            <div><strong>Seller:</strong> <a href="mailto:seller@bharatbazar.com" style="color:#19d3da;">seller@bharatbazar.com</a> / seller123</div>
            <div><strong>Salesperson:</strong> <a href="mailto:salesperson@bharatbazar.com" style="color:#19d3da;">salesperson@bharatbazar.com</a> / sales123</div>
            <div><strong>Customer:</strong> <a href="mailto:customer@bharatbazar.com" style="color:#19d3da;">customer@bharatbazar.com</a> / customer123</div>
        </div>
    </div>
   <script>
    async function handleLogin() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        
        if (!email || !password) {
            showError('Please enter email and password');
            return;
        }
        
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = 'Logging in...';
        
        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });
            
            const data = await response.json();
            
            if (!response.ok) {
                throw new Error(data.error || 'Login failed');
            }
            
            // Store token and user data
            localStorage.setItem('authToken', data.token);
            localStorage.setItem('userId', data.user._id);
            localStorage.setItem('userRole', data.user.role);
            localStorage.setItem('userName', data.user.name);
            localStorage.setItem('userEmail', data.user.email);
            
            showSuccess("Login successful! Redirecting...");
            
            // Redirect based on role
            setTimeout(() => {
                if (data.user.role === 'seller' || data.user.role === 'admin') {
                    window.location.href = 'sellerdashboard.html';
                } else if (data.user.role === 'salesperson') {
                    window.location.href = 'salespersondashboard.html';
                } else {
                    window.location.href = 'customerhome.html';
                }
            }, 1000);
            
        } catch (error) {
            console.error('Login error:', error);
            showError(error.message || 'Unable to login. Please try again.');
            btn.disabled = false;
            btn.textContent = 'Login';
        }
    }
    
    function showError(msg) {
        const err = document.getElementById('errorMessage');
        err.textContent = msg;
        err.style.display = 'block';
        document.getElementById('successMessage').style.display = 'none';
    }
    
    function showSuccess(msg) {
        const suc = document.getElementById('successMessage');
        suc.textContent = msg;
        suc.style.display = 'block';
        document.getElementById('errorMessage').style.display = 'none';
    }
</script>

<script src="/js/bb-status.js" defer></script>
</body>
</html>
